lay:inline-block;background:#EEF5F1;color:#0E403A;padding:8px 12px;border-radius:20px;margin:4px}.hidden{display:none}footer{margin-top:50px;color:#6D7875;font-size:12px}@media(max-width:500px){header{margin-bottom:35px;padding:10px 12px}.brand-logo{width:120px}.panel{padding:18px}}</style></head><body><main><header><div class="brand"><img class="brand-logo" src="https://jet7club.github.io/HW/Human_Wealth_Logo_Complet_Premium.png" alt="Human Wealth — A Brighter Future"></div><select id="lang"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option></select></header><section id="intro"><div class="eyebrow" id="tag">Your Life Compass</div><h1 id="hero">Discover what truly drives you.</h1><p id="sub">Five questions. A clearer direction. Start with what matters most.</p><button class="primary" id="start">Start my journey →</button></section><section class="panel hidden" id="quiz"><div class="progress"><div class="bar" id="bar"></div></div><p class="eyebrow" id="count"></p><h2 id="question"></h2><p id="hint"></p><div class="options" id="options"></div><div class="actions"><button class="secondary" id="back">← Back</button><button class="primary" id="next" disabled>Continue →</button></div></section><section class="panel hidden" id="result"><div class="eyebrow" id="resulttag">Your Life Compass</div><h1 id="resulttitle">Your first insights</h1><div id="summary"></div><h2 id="prioritytitle">Your priority areas</h2><div id="advice"></div><p id="transition"></p><button class="primary" id="deep">Explore the full assessment →</button><button class="secondary" id="restart">Restart</button></section><footer>Human Wealth V2 · Independent prototype · This exploratory assessment is not a validated psychological test.</footer></main><script>

let lang="en",step=0,answers=[[],[],null,null,null];const $=id=>document.getElementById(id),tr=()=>T[lang],li=()=>({en:0,fr:1,es:2})[lang];function show(id){["intro","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function translate(){let t=tr();["tag","hero","sub","start","back","restart","resulttitle","prioritytitle","deep","transition"].forEach(k=>$(k).textContent=t[k]);if(!$("quiz").classList.contains("hidden"))render();if(!$("result").classList.contains("hidden"))results()}function render(){let t=tr(),max=step===0?2:3;$("bar").style.width=((step+1)/5*100)+"%";$("count").textContent=(step+1)+" / 5";$("question").textContent=t.questions[step];$("hint").textContent=step<2?t.hint.replace("{n}",max):"1 — 5";$("options").innerHTML="";let opts=step<2?labels[step][li()]:["1","2","3","4","5"];opts.forEach((label,i)=>{let b=document.createElement("button");b.className="option"+(step<2?answers[step].includes(i)?" active":"":answers[step]===i+1?" active":"");b.textContent=label;b.onclick=()=>{if(step<2){let arr=answers[step];if(arr.includes(i))answers[step]=arr.filter(v=>v!==i);else if(arr.length<max)answers[step]=[...arr,i]}else answers[step]=i+1;render()};$("options").appendChild(b)});$("next").disabled=step<2?answers[step].length!==max:answers[step]===null;$("next").textContent=step===4?t.results:t.next;$("back").disabled=step===0}function results(){let t=tr(),list=labels[0][li()],prior=labels[1][li()];$("summary").innerHTML="<h3>"+t.mot+"</h3>"+answers[0].map(i=>'<span class="pill">'+list[i]+"</span>").join("")+"<h3>"+t.prior+"</h3>"+answers[1].map(i=>'<span class="pill">'+prior[i]+"</span>").join("")+"<p>"+t.life+": "+answers[2]+"/5 · "+t.support+": "+answers[3]+"/5 · "+t.growth+": "+answers[4]+"/5</p>";$("advice").innerHTML=t.advice.map(a=>"<p>• "+a+"</p>").join("")} $("lang").onchange=e=>{lang=e.target.value;translate()};$("start").onclick=()=>{show("quiz");render()};$("back").onclick=()=>{if(step>0)step--;render()};$("next").onclick=()=>{if(step<4){step++;render()}else{show("result");results()}};$("restart").onclick=()=>{step=0;answers=[[],[],null,null,null];show("intro")};$("deep").onclick=()=>alert(tr().transition);translate();
